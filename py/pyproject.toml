[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cgreet"
version = "0.3.1"
description = "Deterministic locale-correct greeting and salutation helpers. No models, no I/O: same input always yields the same output"
readme = "README.md"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
license-files = ["LICENSES/*"]
requires-python = ">=3.10"
keywords = ["i18n", "correspondence", "locale"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]


[project.urls]
Homepage = "https://github.com/corbet-foss/cgreet#readme"
Repository = "https://github.com/corbet-foss/cgreet"
Issues = "https://github.com/corbet-foss/cgreet/issues"

[project.scripts]
cgreet = "cgreet.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cgreet"]
