[package]
name = "cgreet"
version = "0.3.0"
entrypoint = "typst/greet.typ"
authors = ["Julian Y. Richard Corbet"]
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "Deterministic locale-correct greeting and salutation helpers. No models, no I/O: same input always yields the same output. Mirrors the cgreet Rust crate release line."
repository = "https://github.com/corbet-foss/cgreet"
exclude = [".git", ".github", ".crow", "target", "dist", "js", "py", "tests", "scripts"]
